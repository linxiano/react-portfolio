		/>
		<meta property="twitter:image" content="https://www.riber.dev/seo_banner.png" />
		<!-- Structured data -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Steffen Riber Thomsen",
				"url": "https://www.riber.dev/",
				"jobTitle": "Lead Software Developer",
				"address": { "@type": "PostalAddress", "addressLocality": "Copenhagen", "addressCountry": "DK" },
				"sameAs": [
					"https://www.linkedin.com/in/steffenriber/",
					"https://github.com/linxiano",
					"https://twitter.com/linxiano"
				]
			}
		</script>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root">
			<h1>Steffen Riber Thomsen</h1>
			<p>Lead software developer in Copenhagen. Java, TypeScript, and the architecture underneath.</p>
		</div>
		<!-- Resolve the site version before first paint. v1 locks scrolling and
		     v2 does not, so doing this in React would flash the wrong one. -->
		<script>
			(function () {
				var v = 'v2';
				try {
					if (localStorage.getItem('riber:version') === 'v1') v = 'v1';
				} catch (e) {
					/* blocked storage — keep the default */
				}
				document.documentElement.dataset.appVersion = v;
			})();
		</script>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
